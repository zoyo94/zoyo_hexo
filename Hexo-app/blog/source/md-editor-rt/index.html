<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD Editor RT</title>
    <base href="./">
    <!-- 引入 md-editor-rt 的 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/md-editor-rt@6.0.1/lib/style.css" rel="stylesheet" />
    <!-- 引入 ExportPDF 扩展样式 -->
    <link href="https://esm.sh/@vavt/rt-extension/lib/asset/ExportPDF.css" rel="stylesheet" />
    <!-- 引入自定义浮窗样式 -->
    <link rel="stylesheet" href="/md-editor-rt/css/floating-panels.css">
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react",
          "react-dom": "https://esm.sh/react-dom",
          "react/jsx-runtime": "https://esm.sh/react/jsx-runtime",
          "react-dom/client": "https://esm.sh/react-dom/client",
          "medium-zoom": "https://esm.sh/medium-zoom",
          "lru-cache": "https://esm.sh/lru-cache",
          "codemirror": "https://esm.sh/codemirror",
          "lucide-react": "https://cdn.jsdelivr.net/npm/lucide-react/dist/esm/lucide-react.js",
          "@vavt/": "https://esm.sh/@vavt/",
          "@vavt/rt-extension": "https://esm.sh/@vavt/rt-extension",
          "@codemirror/": "https://esm.sh/@codemirror/",
          "@lezer/": "https://esm.sh/@lezer/",
          "markdown-it": "https://esm.sh/markdown-it",
          "markdown-it-image-figures": "https://esm.sh/markdown-it-image-figures",
          "markdown-it-sub": "https://esm.sh/markdown-it-sub",
          "markdown-it-sup": "https://esm.sh/markdown-it-sup",
          "md-editor-rt": "https://esm.sh/md-editor-rt@6.0.1"
        }
      }
    </script>
    <style>
        html, body, #root { /* 将 #app 改为 #root */
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 防止滚动条 */
            display: flex; /* 新增：设置为flex容器 */
            flex-direction: column; /* 新增：子元素垂直排列 */
        }
        /* 强制 md-editor-rt 组件占据所有可用高度 */
        .md-editor-rt {
            flex-grow: 1; /* 允许其填充剩余空间 */
            display: flex; /* 自身也作为flex容器 */
            flex-direction: column; /* 内部元素垂直排列 */
            height: 100% !important; /* 强制高度为100% */
            min-height: 0 !important; /* 覆盖可能的最小高度限制 */
        }
        /* 覆盖 md-editor-rt 库默认的 500px 高度 */
        .md-editor {
            height: 100% !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- 定义全局后端地址 -->
    <script>
        // 全局后端地址配置
        window.BACKEND_URL = 'http://' + window.location.hostname + ':3001';
    </script>

    <!-- 主应用逻辑 - ES 模块方式 -->
    <script type="module" src="/md-editor-rt/js/main.js"></script>

    <script>    
        // 获取 <base> 元素
        const baseElement = document.querySelector('base');
        // 如果 <base> 元素存在，则修改其 href 属性
        if (baseElement) {
            baseElement.href = './public/uploads/';
        }
    </script>

</body>
</html>
